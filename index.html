<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f0f6">
<!-- Установка как приложение: манифест, иконки и поведение на iPhone -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Универ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Шрифт Manrope подгружается из интернета; без интернета включится обычный системный -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Мой универ</title>
<style>
/* =========================================================
   1. ЦВЕТА И ТЕМЫ
   Все цвета лежат в переменных. Хочешь другой оттенок —
   поменяй значение здесь, и поменяется весь сайт.
   Две темы: светлая (по умолчанию) и тёмная.
   ========================================================= */
:root{
  --bg:#f0f0f6;            /* фон страницы */
  --card:#ffffff;          /* карточки */
  --text:#1d1b2e;
  --muted:#7b7993;         /* второстепенный текст */
  --accent:#5a46f0;        /* главный цвет (кнопки, выделения) */
  --accent-2:#8b78ff;      /* второй цвет для градиентов */
  --accent-ink:#5a46f0;    /* акцентный цвет для текста и ссылок */
  --on-accent:#ffffff;     /* текст на акцентном фоне */
  --accent-soft:#ebe8ff;   /* бледная заливка акцентом */
  --line:#e8e7f2;          /* тонкие линии */
  --danger:#d93a4d;
  --shadow-sm:0 6px 16px -12px rgba(60,40,180,.45);
  --nav-bg:rgba(255,255,255,.88);
  --nav-shadow:0 14px 32px -12px rgba(50,35,150,.40);
  --folder-1:#8b78ff; --folder-2:#5a46f0;   /* цвета карточек-папок: верх и низ */
  --hero:linear-gradient(135deg,#5b46f2 0%,#7d69ff 52%,#aca2ff 100%);
  --glow:radial-gradient(70% 38% at 100% 0%,rgba(145,120,255,.42),transparent 70%),
         radial-gradient(60% 34% at 0% 8%,rgba(125,175,255,.30),transparent 70%);
}
[data-theme="dark"]{
  --bg:#0a0708;
  --card:#171011;
  --text:#f5ecec;
  --muted:#a59799;
  --accent:#b3203f;        /* красно-бордовый вместо синего */
  --accent-2:#e0485f;
  --accent-ink:#ff6f86;
  --on-accent:#ffffff;
  --accent-soft:#2c1418;
  --line:#2b1d1f;
  --danger:#ff7a7a;
  --shadow-sm:none;
  --nav-bg:rgba(23,16,17,.90);
  --nav-shadow:0 14px 32px -12px rgba(0,0,0,.9);
  --folder-1:#a42441; --folder-2:#5b101f;
  --hero:linear-gradient(135deg,#2c0911 0%,#781430 52%,#c62e46 100%);
  --glow:radial-gradient(70% 38% at 100% 0%,rgba(190,40,70,.36),transparent 70%),
         radial-gradient(60% 34% at 0% 8%,rgba(120,20,45,.32),transparent 70%);
}

/* =========================================================
   2. ОБЩЕЕ
   ========================================================= */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; color:var(--text);
  background-color:var(--bg); background-image:var(--glow);
  background-repeat:no-repeat; background-attachment:fixed;
  font:16px/1.45 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:140px;
}
.wrap{max-width:720px; margin:0 auto; padding:12px 16px}
h3{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:24px 0 8px}
.empty{color:var(--muted); font-size:14px; margin:6px 2px}
a{color:var(--accent-ink); font-weight:600}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px}

/* ---------- Шапка с градиентом и «стеклянными» плитками ---------- */
.hero{
  position:relative; overflow:hidden; color:#fff;
  background:var(--hero); border-radius:28px;
  padding:22px 20px 18px; margin:4px 0 18px;
}
.hero > *{position:relative; z-index:1}
/* Блестящие «камушки» справа */
.hero::before, .hero::after{
  content:''; position:absolute; border-radius:50%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0, rgba(255,255,255,.30) 22%, rgba(255,255,255,.08) 52%, rgba(255,255,255,0) 70%),
    rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.32);
}
.hero::before{width:170px; height:170px; right:-38px; top:-48px}
.hero::after{width:86px; height:86px; right:104px; top:26px; opacity:.85}
/* Круги медленно «плавают». Скорость: чем больше секунд, тем спокойнее. */
@keyframes floatA{
  0%  {transform:translate(0,0) rotate(0deg)}
  33% {transform:translate(-9%,7%) rotate(4deg)}
  66% {transform:translate(6%,13%) rotate(-3deg)}
  100%{transform:translate(-4%,-6%) rotate(2deg)}
}
@keyframes floatB{
  0%  {transform:translate(0,0) scale(1)}
  30% {transform:translate(22%,-14%) scale(1.05)}
  65% {transform:translate(-18%,10%) scale(.96)}
  100%{transform:translate(10%,22%) scale(1.03)}
}
.hero::before{animation:floatA 22s ease-in-out infinite alternate}
.hero::after {animation:floatB 16s ease-in-out -6s infinite alternate}
/* Если в системе включено «уменьшить движение», круги стоят на месте */
@media (prefers-reduced-motion:reduce){ .hero::before, .hero::after{animation:none} }
.hero h1{margin:0; font-weight:800; font-size:clamp(28px,6vw,40px); line-height:1.1; letter-spacing:-.01em}
.hero p{margin:6px 0 0; opacity:.88; font-weight:500}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px}
.stat{
  background:rgba(255,255,255,.17); border:1px solid rgba(255,255,255,.34);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-radius:18px; padding:10px 6px; text-align:center;
}
.stat b{display:block; font-size:22px; line-height:1.15; font-weight:800}
.stat span{display:block; font-size:12px; opacity:.92; line-height:1.25}

/* ---------- Плавающее меню-«таблетка» ---------- */
nav{
  position:fixed; z-index:5; left:12px; right:12px; max-width:520px; margin:0 auto;
  bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex; gap:2px; padding:5px; border-radius:999px;
  background:var(--nav-bg); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:var(--nav-shadow), 0 0 0 1px var(--line);
}
nav button{
  flex:1 1 auto; min-height:44px; padding:10px 8px; border:0; border-radius:999px;
  background:none; color:var(--muted); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
}
nav button.on{background:var(--accent-soft); color:var(--accent-ink)}

/* Круглая кнопка «+» */
.fab{
  position:fixed; right:18px; z-index:6;
  bottom:calc(88px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--on-accent);
  font-size:30px; line-height:1; cursor:pointer;
  box-shadow:0 14px 26px -10px rgba(0,0,0,.55);
}

/* Кнопки и мелкие элементы: все «пилюлями» */
.btn{
  border:0; border-radius:999px; padding:12px 20px; font:inherit; font-weight:700; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--on-accent);
}
.btn.ghost{background:var(--accent-soft); color:var(--text)}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
.mini{
  border:0; border-radius:999px; padding:2px 12px; min-height:34px; min-width:38px;
  background:var(--accent-soft); color:var(--accent-ink); font:inherit; font-weight:700; cursor:pointer;
}
.seg{display:flex; gap:6px; margin:6px 0 4px; flex-wrap:wrap}
.seg button{
  min-height:40px; padding:6px 16px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-size:14px; font-weight:600;
}
.seg button.on{
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--on-accent); border-color:transparent;
}
.note{
  background:var(--accent-soft); border-radius:20px; padding:12px 14px;
  margin:10px 0; font-size:14px; display:flex; gap:10px; align-items:center; justify-content:space-between;
}

/* =========================================================
   3. РАСПИСАНИЕ
   ========================================================= */
.weeknav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 0 4px}
.weeknav b{font-size:16px; font-weight:800; text-align:center}
.day h2{
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); margin:22px 0 4px;
}
.day.today h2{color:var(--accent-ink)}
.day .date{font-weight:500; text-transform:none; letter-spacing:0; margin-left:8px}
.dayoff{background:var(--accent-soft); border-radius:16px; padding:10px 14px; font-size:14px; font-weight:600; margin:8px 0}
.item{
  display:flex; gap:12px; align-items:center;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-sm);
  border-radius:22px; padding:12px 14px; margin:8px 0; cursor:pointer;
}
.day.today .item{border-color:var(--accent)}
.lesson .time{
  min-width:56px; padding:6px 4px; text-align:center; font-weight:800; font-variant-numeric:tabular-nums;
  background:var(--accent-soft); border-radius:14px;
}
.lesson .time small{display:block; color:var(--muted); font-weight:500}
.bar{width:4px; align-self:stretch; border-radius:4px; background:var(--c)}
.body{flex:1; display:flex; flex-direction:column; min-width:0}
.body b{font-weight:700; overflow-wrap:anywhere}
.body span{color:var(--muted); font-size:14px}
.teacher{font-size:13px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere}

/* =========================================================
   4. ЗАДАНИЯ
   ========================================================= */
.chk{
  width:28px; height:28px; border-radius:50%; flex:none;
  border:2px solid var(--muted); background:none; cursor:pointer; color:var(--on-accent);
  font-size:15px; line-height:1;
}
.chk.on{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent}
.task.done .body b{text-decoration:line-through; color:var(--muted)}
.chip{
  display:inline-block; font-size:12px; font-weight:600; padding:1px 10px; border-radius:999px;
  background:var(--accent-soft); margin-right:6px;
}
.late{color:var(--danger); font-weight:700}

/* =========================================================
   5. ПРЕДМЕТЫ: карточки-«папки»
   ========================================================= */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:26px 12px; margin-top:24px}
.card{
  position:relative; min-height:128px; padding:16px; cursor:pointer; color:#fff;
  display:flex; flex-direction:column; justify-content:space-between; gap:18px;
  background:linear-gradient(160deg,var(--folder-1),var(--folder-2));
  border-radius:24px; box-shadow:0 16px 28px -18px rgba(0,0,0,.55);
}
/* «ушко» папки сверху слева */
.card::before{
  content:''; position:absolute; left:0; top:-12px; width:46%; height:26px;
  background:var(--folder-1); border-radius:16px 16px 0 0;
}
.card b{font-weight:800; font-size:15px; line-height:1.25; padding-right:20px; overflow-wrap:break-word; hyphens:auto; -webkit-hyphens:auto}
.card small{color:rgba(255,255,255,.85); font-size:12.5px; font-weight:500}
.card .sdot{
  position:absolute; top:14px; right:14px; width:14px; height:14px; border-radius:50%;
  background:var(--c); box-shadow:0 0 0 3px rgba(255,255,255,.85);
}
.card .foot{display:flex; align-items:flex-end; justify-content:space-between; gap:8px}
.card .go{
  flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); font-size:15px;
}
.dot{display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--c); margin-right:8px}
.subj-title{font-weight:800; font-size:24px; line-height:1.2; margin:16px 0 0}
textarea,input,select{
  width:100%; padding:11px 12px; border-radius:16px; font:inherit;
  border:1px solid var(--line); background:var(--card); color:var(--text);
}
input[type=color]{padding:2px; height:44px}

/* =========================================================
   6. ОКНО РЕДАКТИРОВАНИЯ
   ========================================================= */
dialog{
  border:0; border-radius:28px; padding:0; width:min(92vw,420px); max-height:92vh; overflow:auto;
  background:var(--card); color:var(--text); box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
}
dialog::backdrop{background:rgba(18,12,40,.5); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
dialog form{padding:20px; display:flex; flex-direction:column; gap:10px}
dialog h3{margin:0 0 4px; font-size:20px; font-weight:800; text-transform:none; letter-spacing:0; color:var(--text)}
dialog label{font-size:13px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; gap:4px}
dialog input, dialog select, dialog textarea{background:var(--bg)}
dialog .row{
  display:flex; gap:8px; justify-content:flex-end; margin-top:6px;
  position:sticky; bottom:0; background:var(--card); padding:10px 0 2px;
}

/* =========================================================
   6б. КАЛЕНДАРЬ
   ========================================================= */
.calnav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0 10px}
.calnav b{font-weight:800; font-size:20px}
.calgrid{display:grid; grid-template-columns:repeat(7, 1fr); gap:4px}
.calh{text-align:center; font-size:12px; font-weight:700; color:var(--muted); padding:2px 0; text-transform:uppercase; letter-spacing:.04em}
.cell{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  min-height:62px; padding:6px 2px; cursor:pointer; font:inherit; color:var(--text);
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
.cell.out{opacity:.4}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--accent-soft); border-color:var(--accent)}
.cell .n{font-size:13px; font-weight:700; min-width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%}
.cell.today .n{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--on-accent)}
.blobs{display:flex; flex-wrap:wrap; gap:3px; justify-content:center; align-items:center; max-width:100%}
.blobs small{font-size:11px; color:var(--muted)}
/* «Пятно»: неровный круг, у каждого чуть своя форма */
.blob{
  display:block; width:14px; height:14px; background:var(--c);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;
}
.blob:nth-child(2n){border-radius:44% 56% 41% 59% / 57% 43% 55% 45%; transform:rotate(40deg)}
.blob:nth-child(3n){border-radius:52% 48% 62% 38% / 42% 60% 40% 58%; transform:rotate(-30deg)}
.blob.done{background:transparent; border:2px solid var(--c); opacity:.55}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin:14px 2px 0; font-size:13px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend .blob{width:12px; height:12px}
.dayhead{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:20px 0 4px}
.dayhead b{font-weight:800; font-size:18px}

/* =========================================================
   6в. НАСТРОЙКИ И НАПОМИНАНИЯ
   ========================================================= */
.panel{
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-sm);
  border-radius:24px; padding:16px; margin:8px 0;
}
.setrow{display:flex; justify-content:space-between; align-items:center; gap:14px}
.setrow b{font-weight:700}
.setrow small{display:block; color:var(--muted); font-size:13px; font-weight:500; margin-top:2px}
/* Переключатель */
.sw{
  flex:none; width:54px; height:32px; padding:3px; border:0; border-radius:999px; cursor:pointer;
  display:flex; align-items:center; background:var(--line); transition:background .2s;
}
.sw i{width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3); transition:transform .2s}
.sw.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.sw.on i{transform:translateX(22px)}
.opts{margin-top:6px; transition:opacity .2s}
.opts.off{opacity:.45; pointer-events:none}
.optlabel{font-size:13px; font-weight:700; color:var(--muted); margin:14px 0 2px}
.opts input[type=time]{max-width:170px}
.status{font-size:13px; color:var(--muted); margin:12px 0 0}
.status.ok{color:var(--accent-ink); font-weight:600}
.panel .seg{margin-top:8px}

/* Напоминание внутри приложения */
.alert{
  display:flex; gap:12px; align-items:center; margin:8px 0; padding:12px 14px;
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:22px;
}
.alert svg{flex:none; width:24px; height:24px; color:var(--accent-ink)}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); z-index:20;
  bottom:calc(92px + env(safe-area-inset-bottom)); max-width:90vw; text-align:center;
  padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600;
  background:var(--text); color:var(--bg); box-shadow:0 12px 28px -10px rgba(0,0,0,.5);
}

/* =========================================================
   6г. ПОИСК
   ========================================================= */
.navsearch{
  flex:none !important; width:44px; padding:0 !important; display:grid; place-items:center;
  background:var(--accent) !important; color:#fff !important; margin-left:4px;
}
.navsearch svg{width:20px; height:20px}
.navsearch:hover{filter:brightness(1.08)}

dialog.searchdlg{
  width:min(94vw,640px); max-height:min(86vh,760px); margin:5vh auto auto; padding:0; overflow:hidden;
}
@supports (height:1dvh){ dialog.searchdlg{max-height:min(86dvh,760px)} }
.searchdlg[open]{display:flex; flex-direction:column}
.sfield{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line)}
.sfield > svg{flex:none; width:22px; height:22px; color:var(--accent-ink)}
.sfield input{
  flex:1; min-width:0; border:0; border-radius:0; background:transparent; padding:8px 4px;
  font-size:16px; font-weight:600; outline:none;
}
.sfield input::-webkit-search-cancel-button{display:none}
#searchResults{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; padding:4px 14px 18px}
.sgroup{
  display:flex; justify-content:space-between; margin:16px 2px 4px;
  font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
}
.sitem{
  display:flex; align-items:center; gap:12px; width:100%; margin:6px 0; padding:10px 12px;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  color:inherit; font:inherit; text-align:left; text-decoration:none; cursor:pointer;
}
.sitem:hover, .sitem:focus-visible{border-color:var(--accent)}
.stext{display:flex; flex-direction:column; flex:1; min-width:0}
.stext b{font-weight:700; overflow-wrap:anywhere}
.stext small{color:var(--muted); font-size:13px; font-weight:500; overflow-wrap:anywhere}
.sitem.done b{text-decoration:line-through; color:var(--muted)}
.sdc{flex:none; width:14px; height:14px; background:var(--c); border-radius:58% 42% 55% 45% / 48% 56% 44% 52%}
.ini{
  flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent-ink); font-weight:800;
}
mark{background:var(--accent-soft); color:var(--accent-ink); font-weight:700; border-radius:4px; padding:0 2px}
.smore{margin:4px 0 0}
.sempty{color:var(--muted); text-align:center; padding:26px 10px 4px; margin:0}
.sempty.small{font-size:13px; padding-top:8px}

/* =========================================================
   6ж. ОЦЕНКИ
   ========================================================= */
.gv{
  flex:none; min-width:46px; height:46px; padding:0 8px; border-radius:16px; display:grid; place-items:center;
  font-weight:800; font-size:18px; background:var(--accent-soft); color:var(--accent-ink);
}
.gv.hi{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:var(--on-accent)}
.gv.bad{background:transparent; color:var(--danger); border:2px solid var(--danger)}
.gv.none{background:transparent; color:var(--muted); font-weight:600}
.item.grade .body b{font-size:15px}

/* Установка как приложение */

/* =========================================================
   7. ТЕЛЕФОН, ПЛАНШЕТ И КОМПЬЮТЕР
   Базовые стили выше рассчитаны на телефон (одна колонка, меню снизу).

  .card{transition:transform .15s} .card:hover{transform:translateY(-3px)}
  .mini:hover, .seg button:hover, nav button:hover{filter:brightness(.96)}

<body>

<div class="wrap">
  <header class="hero">
    <h1>Мой универ</h1>
    <p id="today"></p>
    <div class="stats" id="heroStats"></div>
  </header>

  <!-- Сюда попадают напоминания о дедлайнах -->
  <div id="alerts"></div>

  <!-- Четыре вкладки. Видна всегда только одна. -->
  <section id="tab-week"></section>
  <section id="tab-tasks" hidden></section>
  <section id="tab-calendar" hidden></section>
  <section id="tab-subjects" hidden></section>
  <section id="tab-settings" hidden></section>
</div>

<button class="fab" id="fab" data-act="fab" aria-label="Добавить">+</button>

<nav>
  <button data-act="tab" data-id="week">Расписание</button>
  <button data-act="tab" data-id="tasks">Задания</button>
  <button data-act="tab" data-id="calendar">Календарь</button>
  <button data-act="tab" data-id="subjects">Предметы</button>
  <button data-act="tab" data-id="settings">Ещё</button>
  <button class="navsearch" data-act="opensearch" aria-label="Поиск по приложению" title="Поиск (Ctrl K или /)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
</nav>

<!-- Одно общее окно, которое мы наполняем полями под нужную задачу -->
<dialog id="dlg"><form id="dlgForm"></form></dialog>
<div class="toast" id="toast" hidden></div>

<!-- Окно глобального поиска -->
<dialog id="searchDlg" class="searchdlg" aria-label="Поиск">
  <div class="sfield">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="text" inputmode="search" enterkeyhint="search" placeholder="Что ищем?" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Поиск">
    <button class="mini" id="searchClear" data-act="searchclear" aria-label="Очистить" hidden>✕</button>
    <button class="mini" data-act="searchclose">Закрыть</button>
  </div>
  <div id="searchResults"></div>
</dialog>

<script>
/* =========================================================
   1. ДАННЫЕ
   Всё хранится в браузере (localStorage) в одном объекте state:
   { settings, subjects, lessons, tasks }
   ========================================================= */
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const KEY  = 'moyUniversitet.v5';
const OLD_KEYS = ['moyUniversitet.v4', 'moyUniversitet.v3', 'moyUniversitet.v2', 'moyUniversitet.v1'];   // прошлые версии приложения

const $   = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);

// Защита: превращаем спецсимволы в безопасный текст перед вставкой в HTML
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Дата в формате ГГГГ-ММ-ДД (по местному времени)
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayIdx = () => (new Date().getDay() + 6) % 7;   // Пн = 0 ... Вс = 6

// Отпечатки текстов-примеров из прошлых версий: по ним один раз вычищаем эти тексты из уже сохранённых данных
const LEGACY_NOTE_HASHES = [544718499, 201857429, 1130997903, 471385851];
const textHash = t => { let x = 5381; for (const c of String(t)) x = ((x << 5) + x + c.charCodeAt(0)) | 0; return x; };

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
    // Перенос из прошлых версий, если там уже были твои собственные записи
    for (const k of OLD_KEYS){
      const old = localStorage.getItem(k);
      if (!old) continue;
      const o = JSON.parse(old);
      if ([...(o.subjects || []), ...(o.lessons || []), ...(o.tasks || [])].some(x => !x.ex)) return normalize(o);
    }
  } catch(e) {}
  return normalize({});          // чистое приложение: ничего заранее не заполнено
}
// Подстраховка: если чего-то не хватает в данных, добавляем пустое
function normalize(s){
  s.settings = Object.assign({ theme:'light', week:'all', showDone:false, group:'all' }, s.settings);
  // старые названия тем переносим на новые (светлая / тёмная)
  s.settings.theme = ({ paper:'light', pastel:'light', night:'dark' })[s.settings.theme] || s.settings.theme;
  if (s.settings.theme !== 'dark') s.settings.theme = 'light';
  // уведомления: on — включены, days — за сколько дней напоминать (0 = в день срока),
  // time — во сколько, scope — о чём: 'all' (все задания со сроком) или 'deadline' (только дедлайны)
  s.settings.notify = Object.assign({ on:false, days:[0,1], time:'09:00', scope:'all' }, s.settings.notify);
  // Google Диск: connected — аккаунт привязан,
  // auto — сохранять на Диск само, lastRemote — версия файла на Диске при последней синхронизации,
  // dirty — есть изменения, ещё не отправленные на Диск, conflict — версии на Диске и здесь разошлись
  s.settings.drive = Object.assign({ connected:false, email:'', name:'', auto:true,
    lastSync:'', lastRemote:'', dirty:false, conflict:false }, s.settings.drive);
  s.reminded = s.reminded || {};   // о чём уже напомнили, чтобы не повторять
  s.alerts   = s.alerts   || [];   // напоминания, которые показаны в приложении
  s.subjects = (s.subjects || []).map(x => Object.assign({ notes:'', links:[], files:[], grades:[] }, x));
  s.subjects.forEach(x => { if (!Array.isArray(x.files)) x.files = []; if (!Array.isArray(x.grades)) x.grades = []; });   // файлы, прикреплённые на Google Диск
  if (!Array.isArray(s.exams)) s.exams = [];
  s.exams = s.exams.map(e => Object.assign({ title:'', subjectId:'', kind:'exam', sem:1, date:'', time:'', room:'', note:'', topics:[], passed:false, result:'' }, e));
  s.exams.forEach(e => { if (!Array.isArray(e.topics)) e.topics = []; });
  s.lessons  = s.lessons || [];
  s.dayoffs  = s.dayoffs || [];
  s.tasks    = s.tasks   || [];
  s.grades   = undefined; delete s.grades;
  // Одноразовая чистка (раз в жизни данных): убираем подготовленные примеры из прошлых версий
  if (s.cleanV !== 1){
    s.tasks = s.tasks.filter(t => !t.ex);                                     // примеры заданий
    s.subjects.forEach(x => { if (x.notes && LEGACY_NOTE_HASHES.includes(textHash(x.notes))) x.notes = ''; });   // примеры конспектов
    // нетронутые заготовки экзаменов и зачётов: без даты, вопросов, заметок и результата
    s.exams = s.exams.filter(e => e.date || e.passed || e.result || e.note || e.topics.length);
    s.cleanV = 1;
  }
  // метки «пример» больше не нужны: всё, что есть в данных, это твои записи
  [s.subjects, s.lessons, s.tasks, s.dayoffs].forEach(list => list.forEach(x => { delete x.ex; }));
  return s;
}
let quietSave = false;   // true — сохраняем, не считая это изменением данных (для служебных записей)
function save(){
  if (!quietSave) noteLocalChange();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}
function saveQuiet(){ quietSave = true; try { save(); } finally { quietSave = false; } }

let state = load();
let currentTab  = 'week';
let weekStart = initialWeekStart();   // понедельник той недели, которая сейчас на экране
// Учебный год 2026/27 по учебному плану: семестры, сессии, каникулы
const PERIODS = [
  { k:'sem1', name:'1 семестр',       from:'2026-09-01', to:'2026-12-26' },
  { k:'win',  name:'Зимняя сессия',   from:'2026-12-28', to:'2027-01-09' },
  { k:'hol1', name:'Зимние каникулы', from:'2027-01-11', to:'2027-01-23' },
  { k:'sem2', name:'2 семестр',       from:'2027-01-25', to:'2027-06-05' },
  { k:'sum',  name:'Летняя сессия',   from:'2027-06-07', to:'2027-06-30' },
  { k:'hol2', name:'Летние каникулы', from:'2027-07-01', to:'2027-08-31' }
];
const EXAM_KIND = { exam:'Экзамен', credit:'Зачёт' };
let openSubject = null;      // id предмета, страница которого открыта
let subjView = 'list';                  // вкладка «Предметы»: 'list' или 'grades'
let taskView = 'tasks';                  // вкладка «Задания»: 'tasks' или 'session'
let openExam = null;                    // id экзамена или зачёта, страница которого открыта
let sessSem = (() => { const t = iso(new Date()); const p = PERIODS.find(x => t >= x.from && t <= x.to) || PERIODS.find(x => x.from > t);
  return p && ['sem2', 'sum', 'hol2'].includes(p.k) ? 2 : 1; })();
let calMonth = monthStart(new Date());   // какой месяц показан в календаре
let calSel   = iso(new Date());          // какой день выбран в календаре
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }

const subj = id => state.subjects.find(s => s.id === id) || { name:'Без предмета', color:'#999999' };

// Сохранить и перерисовать всё
function commit(){ save(); renderAll(); }

/* =========================================================
   2. ДАТЫ
   ========================================================= */
function daysUntil(due){
  const a = new Date(due + 'T00:00:00');
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.round((a - b) / 864e5);
}
function dueLabel(due){
  if (!due) return '';
  const n = daysUntil(due);
  const pretty = new Date(due + 'T00:00:00').toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
  if (n < 0)  return `<span class="late">просрочено · ${pretty}</span>`;
  if (n === 0) return `<span class="late">сегодня</span>`;
  if (n === 1) return `завтра · ${pretty}`;
  return `${pretty} · через ${n} дн.`;
}

/* =========================================================
   3. ОТРИСОВКА ВКЛАДОК
   ========================================================= */
function renderAll(){
  document.documentElement.dataset.theme = state.settings.theme;
  $('#today').textContent = new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
  renderHero(); renderAlerts(); renderWeek(); renderTasks(); renderCalendar(); renderSubjects(); renderSettings(); showTab();
}

/* ---------- Шапка: дата и три плитки ---------- */
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };

function renderHero(){
  const todayISO = iso(new Date());
  const lessons = state.lessons.filter(l => lessonOn(l, todayISO, todayIdx())).length;
  const open = state.tasks.filter(t => !t.done);
  const next = open.concat(examItems().filter(x => !x.done)).filter(t => t.due && t.due >= todayISO).sort((a, b) => a.due.localeCompare(b.due))[0];
  const d = next ? daysUntil(next.due) : null;
  const tiles = [
    [lessons, plural(lessons, ['пара', 'пары', 'пар']) + ' сегодня'],
    [open.length, plural(open.length, ['задание', 'задания', 'заданий']) + ' в работе'],
    [next ? (d === 0 ? 'Сегодня' : d === 1 ? 'Завтра' : d + ' ' + plural(d, ['день', 'дня', 'дней'])) : '—',
     next ? 'до ближайшего срока' : 'сроков нет']
  ];
  $('#heroStats').innerHTML = tiles.map(([v, t]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(t)}</span></div>`).join('');

  // цвет адресной строки на телефоне подстраиваем под тему
  const mt = document.querySelector('meta[name="theme-color"]');
  if (mt && mt.setAttribute) mt.setAttribute('content', state.settings.theme === 'dark' ? '#0a0708' : '#f0f0f6');
}

function showTab(){
  ['week','tasks','calendar','subjects','settings'].forEach(t => { $('#tab-' + t).hidden = (t !== currentTab); });
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === currentTab));
  $('#fab').hidden = (currentTab === 'settings');
}

/* ---------- Расписание ---------- */
function lessonHTML(l){
  const s = subj(l.subjectId);
  const meta = [l.kind, l.room, l.week === 'even' ? 'чётная' : l.week === 'odd' ? 'нечётная' : ''].filter(Boolean).join(' · ');
  return `<div class="item lesson" data-act="editlesson" data-id="${l.id}" style="--c:${esc(s.color)}">
    <div class="time">${esc(l.start)}<small>${esc(l.end)}</small></div>
    <div class="bar"></div>
    <div class="body"><b>${esc(s.name)}</b><span>${esc(meta)}</span>${l.teacher ? `<div class="teacher">${esc(l.teacher)}</div>` : ''}</div>
  </div>`;
}

// Понедельник той недели, в которой лежит дата d
function mondayOf(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - (x.getDay() + 6) % 7);
  return x;
}
// Если сегодня воскресенье, сразу показываем следующую неделю
function initialWeekStart(){
  const d = new Date();
  if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return mondayOf(d);
}

// Показывать ли пару l в этот день?
//  - у пары есть список дат (dates)  → только в эти даты
//  - списка дат нет                  → каждую неделю в свой день недели (с учётом чётной/нечётной)
//  - у пары указана группа           → только если выбрана эта группа (или «Все группы»)
function lessonOn(l, dateISO, dayIdx){
  const g = state.settings.group;
  if (g !== 'all' && l.groups && l.groups.length && !l.groups.includes(g)) return false;
  if (l.dates && l.dates.length) return l.dates.includes(dateISO);
  const wk = state.settings.week;
  return l.day === dayIdx && (wk === 'all' || l.week === 'all' || l.week === wk);
}

function renderWeek(){
  const todayISO = iso(new Date());
  const wk = state.settings.week, grp = state.settings.group;
  const groups = [...new Set(state.lessons.flatMap(l => l.groups || []))].sort();
  const fmt = d => d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
  const last = new Date(weekStart); last.setDate(last.getDate() + 5);

  let html = '';
  if (groups.length > 1) html += `<div class="seg">` + [['all','Все группы'], ...groups.map(g => [g, g])]
    .map(([k, t]) => `<button data-act="group" data-id="${esc(k)}" class="${grp===k?'on':''}">${esc(t)}</button>`).join('') + `</div>`;
  if (state.lessons.some(l => l.week && l.week !== 'all')) html += `<div class="seg">` + [['all','Все недели'],['even','Чётная'],['odd','Нечётная']]
    .map(([k, t]) => `<button data-act="week" data-id="${k}" class="${wk===k?'on':''}">${t}</button>`).join('') + `</div>`;
  html += `<div class="weeknav">
      <button class="mini" data-act="wkprev" aria-label="Прошлая неделя">←</button>
      <b>${fmt(weekStart)} — ${fmt(last)}</b>
      <button class="mini" data-act="wknext" aria-label="Следующая неделя">→</button>
    </div>
    <div class="seg"><button data-act="wktoday">К текущей неделе</button></div>`;

  html += '<div class="days">';
  DAYS.forEach((name, i) => {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const dISO = iso(d);
    const ls = state.lessons.filter(l => lessonOn(l, dISO, i)).sort((a, b) => a.start.localeCompare(b.start));
    const off = state.dayoffs.find(x => x.date === dISO);
    if (i === 6 && !ls.length && !off) return;      // воскресенье показываем, только если там что-то есть
    html += `<div class="day ${dISO===todayISO?'today':''}">
      <h2><span>${name}<span class="date">${fmt(d)}${dISO===todayISO?' · сегодня':''}</span></span><button class="mini" data-act="addlesson" data-id="${dISO}">+</button></h2>

function renderCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;          // сколько клеток до 1-го числа (пн = 0)
  const rows = Math.ceil((offset + new Date(y, m + 1, 0).getDate()) / 7);
  const todayISO = iso(new Date());

  // Задания, разложенные по дням
  const byDay = {};
  calItems().forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t); });

  let title = calMonth.toLocaleDateString('ru-RU', { month:'long', year:'numeric' }).replace(' г.', '');
  title = title.charAt(0).toUpperCase() + title.slice(1);

  let html = `<div class="calnav">
      <button class="mini" data-act="calprev" aria-label="Прошлый месяц">←</button>

    <div class="calgrid">` + ['пн','вт','ср','чт','пт','сб','вс'].map(d => `<div class="calh">${d}</div>`).join('');

  for (let i = 0; i < rows * 7; i++){
    const d = new Date(y, m, 1 - offset + i), dISO = iso(d);
    const list = byDay[dISO] || [];
    const blobs = list.slice(0, 4).map(t =>
      `<i class="blob ${t.done ? 'done' : ''} ${t._exam ? 'exam' : ''}" style="--c:${esc(subj(t.subjectId).color)}"></i>`).join('') +
      (list.length > 4 ? `<small>+${list.length - 4}</small>` : '');
    html += `<button class="cell ${d.getMonth() !== m ? 'out' : ''} ${dISO === todayISO ? 'today' : ''} ${dISO === calSel ? 'sel' : ''}"
        data-act="calday" data-id="${dISO}" aria-label="${d.getDate()}, заданий: ${list.length}">
        <span class="n">${d.getDate()}</span><span class="blobs">${blobs}</span></button>`;
  }
  html += `</div>`;

  // Что значат цвета
  const monthKey = y + '-' + String(m + 1).padStart(2, '0');

  const hasExam = calItems().some(t => t._exam && t.due && t.due.startsWith(monthKey));
  const legend = state.subjects.filter(s => used.has(s.id));
  if (legend.length || hasExam) html += `<div class="legend">` + legend.map(s =>
    `<span><i class="blob" style="--c:${esc(s.color)}"></i>${esc(s.name)}</span>`).join('') +
    (hasExam ? ' <span><i class="blob exam" style="--c:#888"></i>экзамен или зачёт</span>' : '') +
    ` <span><i class="blob done" style="--c:#888"></i>сделано</span></div>`;

  // Выбранный день
  const sel = (byDay[calSel] || []).slice().sort((a, b) => (a.done - b.done));
  const label = new Date(calSel + 'T00:00:00').toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
  html += `<div class="dayhead"><b>${esc(label.charAt(0).toUpperCase() + label.slice(1))}</b><button class="mini" data-act="caladd">+ Задание</button></div>` +
    (sel.length ? sel.map(taskHTML).join('') : `<p class="empty">В этот день сроков нет</p>`);

  $('#tab-calendar').innerHTML = html;

/* ---------- Глобальный поиск ---------- */
// Приводим текст к удобному для сравнения виду: маленькие буквы, «ё» = «е»
const norm = s => String(s ?? '').toLowerCase().replace(/ё/g, 'е');
// Отрезаем окончание, чтобы «психология» находила «психологии», а «иванова» — «Ивановой»
const stem = t => t.length <= 4 ? t : t.length === 5 ? t.slice(0, -1) : t.slice(0, -2);
const tokenize = q => [...new Set(norm(q).split(/\s+/).filter(Boolean).map(stem))].slice(0, 6);
// Где заканчивается слово, начавшееся до позиции i (чтобы подсвечивать и выделять слово целиком)
const wordEnd = (n, i) => { while (i < n.length && /[\p{L}\p{N}]/u.test(n[i])) i++; return i; };
// Слова запроса должны все встретиться в тексте (в любом порядке)
const hasAll = (text, tokens) => { const h = norm(text); return tokens.every(t => h.includes(t)); };
const SEARCH_LIMIT = 6;       // сколько результатов показывать в группе до «Показать ещё»
let searchMore = {};          // какие группы развёрнуты

// Текст с подсвеченными совпадениями (всё экранировано)
function hl(text, tokens){
  const raw = String(text ?? ''), n = norm(raw);
  if (!tokens.length || n.length !== raw.length) return esc(raw);
  const mark = new Array(raw.length).fill(false);
  tokens.forEach(t => { let i = n.indexOf(t); while (i !== -1){ for (let k = i, e = wordEnd(n, i + t.length); k < e; k++) mark[k] = true; i = n.indexOf(t, i + 1); } });
  let out = '', i = 0;
  while (i < raw.length){
    let j = i; while (j < raw.length && mark[j] === mark[i]) j++;
    const seg = esc(raw.slice(i, j));
    out += mark[i] ? '<mark>' + seg + '</mark>' : seg; i = j;
  }
  return out;
}
// Короткий фрагмент конспекта вокруг первого совпадения
function snippet(text, tokens){
  const flat = String(text).replace(/\s+/g, ' ').trim(), n = norm(flat);
  let pos = -1; tokens.forEach(t => { const i = n.indexOf(t); if (i !== -1 && (pos === -1 || i < pos)) pos = i; });
  const a = Math.max(0, pos - 40), b = Math.min(flat.length, pos + 90);
  return (a > 0 ? '…' : '') + flat.slice(a, b) + (b < flat.length ? '…' : '');
}

// Преподаватели собираются из пар расписания: из «ст. преп. Иванова А.А.» получается фамилия «Иванова»
function teacherIndex(){
  const map = new Map();
  state.lessons.forEach(l => {
    String(l.teacher || '').split(/\s*;\s*/).forEach(part => {
      const label = part.trim(); if (!label) return;
      const name = label.replace(/^((доц|проф|асс|ст\. ?преп|преп\.-стаж|преп)\.?\s*)+/i, '').trim() || label;
      const key = norm(name);
      if (!map.has(key)) map.set(key, { label, name, lessons: [] });
      map.get(key).lessons.push(l);
    });
  });
  return [...map.values()];
}
// Ближайшая будущая пара из списка (или null)
function nextLesson(lessons){
  const now = new Date(), today = new Date(now); today.setHours(0, 0, 0, 0);
  const todayISO = iso(today), nowHM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  let best = null;
  lessons.forEach(l => {
    let date = null;
    if (l.dates && l.dates.length){
      date = l.dates.filter(d => d > todayISO || (d === todayISO && l.end >= nowHM)).sort()[0] || null;
    } else {
      const add = (l.day - todayIdx() + 7) % 7 + (((l.day - todayIdx() + 7) % 7 === 0 && l.end < nowHM) ? 7 : 0);
      const d = new Date(today); d.setDate(d.getDate() + add); date = iso(d);
    }
    if (!date) return;
    const k = date + ' ' + l.start;
    if (!best || k < best.k) best = { k, date, lesson:l };
  });
  return best;
}

const sItem = (cls, attrs, color, inner) =>
  `<button class="sitem ${cls}" ${attrs}>${color ? `<i class="sdc" style="--c:${esc(color)}"></i>` : ''}<span class="stext">${inner}</span></button>`;

function searchAll(tokens){
  // Предметы
  const subjects = state.subjects.filter(s => hasAll(s.name, tokens)).map(s => {
    const n = state.tasks.filter(t => t.subjectId === s.id && !t.done).length;
    return sItem('', `data-act="sr" data-kind="subj" data-id="${esc(s.id)}"`, s.color,
      `<b>${hl(s.name, tokens)}</b><small>${n ? 'Заданий: ' + n : 'Всё сдано'} · ссылок: ${s.links.length}</small>`);
  });

  // Задания (ищем и по названию предмета)
  const tasks = state.tasks.filter(t => hasAll(t.title + ' ' + subj(t.subjectId).name, tokens))
    .sort((a, b) => (a.done - b.done) || (a.due || '9999').localeCompare(b.due || '9999'))
    .map(t => {
      const s = subj(t.subjectId), when = t.done ? 'сделано' : dueLabel(t.due);
      return sItem(t.done ? 'done' : '', `data-act="sr" data-kind="task" data-id="${esc(t.id)}"`, s.color,
        `<b>${hl(t.title, tokens)}</b><small>${esc(s.name)} · ${t.type === 'deadline' ? 'дедлайн' : 'ДЗ'}${when ? ' · ' + when : ''}</small>`);
    });

  // Конспекты
  const notes = state.subjects.filter(s => s.notes && hasAll(s.notes, tokens)).map(s => {
    const n = norm(s.notes); let pos = -1, len = 0;
    tokens.forEach(t => { const i = n.indexOf(t); if (i !== -1 && (pos === -1 || i < pos)){ pos = i; len = t.length; } });
    len = wordEnd(n, pos + len) - pos;
    return sItem('', `data-act="sr" data-kind="note" data-id="${esc(s.id)}" data-pos="${pos}" data-len="${len}"`, s.color,
      `<b>${esc(s.name)}</b><small>${hl(snippet(s.notes, tokens), tokens)}</small>`);
  });

  // Преподаватели (ищем и по предметам, которые они ведут)
  const teachers = teacherIndex().map(t => ({ t, subjects:[...new Set(t.lessons.map(l => subj(l.subjectId).name))] }))
    .filter(x => hasAll(x.t.label + ' ' + x.subjects.join(' '), tokens))
    .map(({ t, subjects }) => {
      const nx = nextLesson(t.lessons);
      const nextTxt = nx
        ? 'ближайшая: ' + new Date(nx.date + 'T00:00:00').toLocaleDateString('ru-RU', { weekday:'short', day:'numeric', month:'short' }) +
          ' ' + nx.lesson.start + (nx.lesson.room ? ', ' + nx.lesson.room : '')
        : 'пар в расписании больше нет';
      return `<button class="sitem" data-act="sr" data-kind="teacher" data-id="${esc(t.name)}" data-date="${nx ? nx.date : ''}">
        <i class="ini">${esc(t.name.charAt(0).toUpperCase())}</i>
        <span class="stext"><b>${hl(t.label, tokens)}</b><small>${hl(subjects.join(', '), tokens)} · ${esc(nextTxt)}</small></span></button>`;
    });

  // Материалы (ссылки)
  const links = [];
  state.subjects.forEach(s => s.links.forEach(l => {
    if (!hasAll(l.title + ' ' + l.url, tokens)) return;
    let host = ''; try { host = new URL(l.url).hostname; } catch(e) {}
    const inner = `<b>${hl(l.title, tokens)}</b><small>${esc(s.name)}${host ? ' · ' + esc(host) : ''}</small>`;
    links.push(safeUrl(l.url) === '#'
      ? sItem('', `data-act="sr" data-kind="subj" data-id="${esc(s.id)}"`, s.color, inner)
      : `<a class="sitem" href="${esc(l.url)}" target="_blank" rel="noopener"><i class="sdc" style="--c:${esc(s.color)}"></i><span class="stext">${inner}</span></a>`);
  }));

  return [
    { key:'subj',    title:'Предметы',       items:subjects },
    { key:'task',    title:'Задания',        items:tasks },
    { key:'note',    title:'Конспекты',      items:notes },
    { key:'teacher', title:'Преподаватели',  items:teachers },
    { key:'link',    title:'Материалы',      items:links }
  ];
}

function renderSearch(){
  const input = $('#searchInput'), box = $('#searchResults');
  const tokens = tokenize(input.value);
  $('#searchClear').hidden = !input.value;

  if (!tokens.length){
    const withNotes = state.subjects.filter(s => s.notes && s.notes.trim()).length;
    box.innerHTML = `<p class="sempty">Ищи по названию предмета, фамилии преподавателя, словам из конспектов и заданий.</p>
      <p class="sempty small">В поиске: предметов ${state.subjects.length}, заданий ${state.tasks.length}, конспектов ${withNotes}, преподавателей ${teacherIndex().length}.</p>`;
    return;
  }
  const groups = searchAll(tokens).filter(g => g.items.length);
  if (!groups.length){
    box.innerHTML = `<p class="sempty">Ничего не нашлось по «${esc(input.value.trim())}».<br>Попробуй слово покороче или другую форму слова.</p>`;
    return;
  }
  box.innerHTML = groups.map(g => {
    const shown = searchMore[g.key] ? g.items : g.items.slice(0, SEARCH_LIMIT), rest = g.items.length - shown.length;
    return `<div class="sgroup"><span>${g.title}</span><span>${g.items.length}</span></div>` + shown.join('') +
      (rest > 0 ? `<button class="mini smore" data-act="searchmore" data-id="${g.key}">Показать ещё ${rest}</button>` : '');
  }).join('');
}

const fmtBytes = b => {
  b = +b; if (!b) return '0 Б';
  const u = ['Б', 'КБ', 'МБ', 'ГБ', 'ТБ']; let i = 0;
  while (b >= 1024 && i < u.length - 1){ b /= 1024; i++; }
  return (b >= 10 || i === 0 ? Math.round(b) : b.toFixed(1).replace('.', ',')) + ' ' + u[i];
};

// Подгружаем скрипт входа Google, только когда он нужен
function loadGis(){
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => resolve(); s.onerror = () => reject(new Error('gis'));
    document.head.appendChild(s);
  });
}
// Получить ключ доступа. prompt: 'select_account' — выбрать аккаунт, '' — обычный вход, 'none' — тихо, без окон
// В приложении для компьютера вход идёт через обычный браузер (его даёт оболочка Electron, window.desktopAuth),
// а продление — тихо, по долгоживущему ключу, который хранится зашифрованным на устройстве.
// Android (оболочка Capacitor): вход в системном браузере (Chrome Custom Tab), возврат через ссылку com.moyuniver.app:/oauth2redirect
const ANDROID_CLIENT_ID = '650324728890-9ouhki6h12og49s7srn4mc0h214o4gkc.apps.googleusercontent.com';
const ANDROID_REDIRECT = 'com.moyuniver.app:/oauth2redirect';
const REFRESH_KEY = 'moyUniversitet.driveRefresh';
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function googleTokenCall(params){
  const r = await fetch('https://oauth2.googleapis.com/token', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:new URLSearchParams(Object.assign({ client_id:ANDROID_CLIENT_ID }, params)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'http' + r.status);
  return j;
}
function androidAuth(){
  const C = window.Capacitor;
  if (!(C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Browser && C.Plugins.App)) return null;
  const { Browser, App } = C.Plugins;
  return {
    async refresh(){
      let rt = ''; try { rt = localStorage.getItem(REFRESH_KEY) || ''; } catch(_) {}
      if (!rt || !ANDROID_CLIENT_ID) return null;
      try { const t = await googleTokenCall({ refresh_token:rt, grant_type:'refresh_token' }); return { access_token:t.access_token, expires_in:t.expires_in }; }
      catch(e){ if (e.message === 'invalid_grant') try { localStorage.removeItem(REFRESH_KEY); } catch(_) {} return null; }
    },
    async login(hint){
      if (!ANDROID_CLIENT_ID) throw new Error('config');
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(48))), state = b64url(crypto.getRandomValues(new Uint8Array(16)));
      const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
      const q = new URLSearchParams({ client_id:ANDROID_CLIENT_ID, redirect_uri:ANDROID_REDIRECT, response_type:'code', scope:DRIVE_SCOPE, state,
        code_challenge:challenge, code_challenge_method:'S256', access_type:'offline', prompt:'consent' });
      if (hint) q.set('login_hint', hint);
      const code = await new Promise((resolve, reject) => {
        let handle = null;
        const timer = setTimeout(() => done(new Error('popup_timeout')), 5 * 60 * 1000);
        function done(err, val){ clearTimeout(timer); if (handle) handle.remove(); try { Browser.close(); } catch(_) {} err ? reject(err) : resolve(val); }
        App.addListener('appUrlOpen', ev => {
          if (!ev.url || !ev.url.startsWith(ANDROID_REDIRECT)) return;
          const u = new URL(ev.url.replace(ANDROID_REDIRECT, 'https://x/cb'));
          const err = u.searchParams.get('error'), got = u.searchParams.get('code');
          if (u.searchParams.get('state') !== state || err || !got) return done(new Error(err === 'access_denied' ? 'access_denied' : 'popup_failed'));
          done(null, got);
        }).then(h => { handle = h; });
        Browser.open({ url:'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString() }).catch(e => done(e));
      });
      const t = await googleTokenCall({ code, code_verifier:verifier, grant_type:'authorization_code', redirect_uri:ANDROID_REDIRECT });
      if (t.refresh_token) try { localStorage.setItem(REFRESH_KEY, t.refresh_token); } catch(_) {}
      return { access_token:t.access_token, expires_in:t.expires_in };
    },
    async logout(){ let rt = ''; try { rt = localStorage.getItem(REFRESH_KEY) || ''; localStorage.removeItem(REFRESH_KEY); } catch(_) {} if (rt) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(rt), { method:'POST' }).catch(() => {}); return true; }
  };
}
let androidAuthObj;
const nativeAuth = () => (typeof window !== 'undefined' && window.desktopAuth) || (androidAuthObj || (androidAuthObj = androidAuth()));
async function nativeToken(prompt, hint, force){
  const na = nativeAuth();
  let r = null;
  if (!force){ try { r = await na.refresh(); } catch(_) { r = null; } }
  if (!r && (force || prompt !== 'none')) r = await na.login(hint || driveCfg().email || '');
  if (!r || !r.access_token) throw new Error('auth');
  driveToken = r.access_token; driveTokenExp = Date.now() + (Number(r.expires_in || 3600) - 60) * 1000; driveNeedAuth = false; rememberToken();
  return driveToken;
}
function requestToken(prompt, hint, force){
  if (nativeAuth()) return nativeToken(prompt, hint, force);
  const d = driveCfg();
  return loadGis().then(() => new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: driveClientId(), scope: DRIVE_SCOPE,
      callback: resp => {
        if (resp.error) return reject(new Error(resp.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(resp, 'https://www.googleapis.com/auth/drive.file')) return reject(new Error('scope'));
        driveToken = resp.access_token; driveTokenExp = Date.now() + (Number(resp.expires_in) - 60) * 1000; driveNeedAuth = false; rememberToken();
        resolve(driveToken);
      },
      error_callback: err => reject(new Error((err && err.type) || 'popup'))
    });
    client.requestAccessToken({ prompt, hint: hint || d.email || undefined });
  }));
}
const tokenValid = () => !!driveToken && Date.now() < driveTokenExp;
const validToken = () => tokenValid() ? Promise.resolve(driveToken) : requestToken('none');

async function driveFetch(url, opts = {}){
  const token = await validToken();
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({}, opts.headers, { Authorization:'Bearer ' + token }) }));
  if (r.status === 401){ driveToken = null; rememberToken(); throw new Error('auth'); }
  if (!r.ok){ const e = new Error('http' + r.status); e.status = r.status; try { e.body = await r.text(); } catch(_) {} throw e; }
  return r;
}
// Человеческое объяснение ошибки
function driveExplain(e){
  const m = String((e && e.message) || e), body = String((e && e.body) || '');
  if (m === 'scope') return 'Google не выдал доступ к Диску. При входе оставь отмеченной галочку доступа к Диску.';
  if (m === 'auth' || /popup|interaction|login_required|consent|immediate|access_denied/i.test(m)) return 'Нужно подтвердить вход в Google. Нажми «Войти снова».';
  if (m === 'gis') return 'Не удалось загрузить вход Google. Проверь интернет.';
  if (e && e.status === 403 && /accessNotConfigured|has not been used|disabled/i.test(body)) return 'В проекте Google Cloud не включён Google Drive API. Включи его (шаг 2 инструкции).';
  if (e && e.status === 403) return 'Google отказал в доступе (403). Проверь, что твой аккаунт добавлен в тестовые пользователи.';
  if (e && e.status === 404) return 'Файл на Диске не найден. Нажми «Отправить на Диск».';
  if (e && e.status === 429) return 'Google просит подождать: слишком много запросов. Попробуй чуть позже.';
  if (e instanceof TypeError) return 'Нет связи с Google. Проверь интернет.';
  return 'Ошибка Google Диска: ' + m;
}

// Находим (или создаём) папку и ищем в ней файл с данными
async function driveLocate(){
  const j = async r => (await r).json();
  let folderId;
  const fq = "mimeType='application/vnd.google-apps.folder' and name='" + DRIVE_FOLDER + "' and trashed=false";
  const folders = await j(driveFetch(GAPI + '/files?fields=files(id)&q=' + encodeURIComponent(fq)));
  if (folders.files && folders.files[0]) folderId = folders.files[0].id;
  else folderId = (await j(driveFetch(GAPI + '/files?fields=id', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ name:DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder' }) }))).id;
  const q = "name='" + DRIVE_FILE + "' and '" + folderId + "' in parents and trashed=false";
  const files = await j(driveFetch(GAPI + '/files?fields=files(id,modifiedTime)&q=' + encodeURIComponent(q)));
  return { folderId, file: (files.files && files.files[0]) || null };
}
// Что именно кладём на Диск. Не берём настройки этого устройства (вход, тема) и служебное.
function drivePayload(){
  const copy = JSON.parse(JSON.stringify(state));
  delete copy.settings.drive; delete copy.settings.theme;
  copy.alerts = []; copy.reminded = {};
  return { format:'moy-universitet', v:1, savedAt:new Date().toISOString(), state:copy };
}
async function drivePush(loc){
  const json = JSON.stringify(drivePayload());
  let r;
  if (loc.file){
    r = await driveFetch(GUP + '/files/' + loc.file.id + '?uploadType=media&fields=id,modifiedTime',
      { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body:json });
  } else {
    const b = 'muni' + uid(), meta = JSON.stringify({ name:DRIVE_FILE, parents:[loc.folderId], mimeType:'application/json' });
    r = await driveFetch(GUP + '/files?uploadType=multipart&fields=id,modifiedTime', { method:'POST',
      headers:{ 'Content-Type':'multipart/related; boundary=' + b },
      body:'--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta +
           '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + json + '\r\n--' + b + '--' });
  }
  const meta = await r.json(), d = driveCfg();
  Object.assign(d, { lastRemote:meta.modifiedTime, dirty:false, conflict:false, lastSync:new Date().toISOString() });
}
async function drivePull(loc){
  const obj = JSON.parse(await (await driveFetch(GAPI + '/files/' + loc.file.id + '?alt=media')).text());
  const incoming = obj.state || obj;
  if (!incoming || !Array.isArray(incoming.subjects) || !Array.isArray(incoming.lessons) || !Array.isArray(incoming.tasks))
    throw new Error('Файл на Диске не похож на данные приложения');
  const keep = { drive:driveCfg(), theme:state.settings.theme, alerts:state.alerts, reminded:state.reminded };
  state = normalize(incoming);
  state.settings.drive = keep.drive; state.settings.theme = keep.theme; state.alerts = keep.alerts; state.reminded = keep.reminded;
  Object.assign(state.settings.drive, { lastRemote:loc.file.modifiedTime, dirty:false, conflict:false, lastSync:new Date().toISOString() });
  openSubject = null; saveQuiet(); renderAll();
}
// mode: 'auto' — решить самой, 'push' — отправить на Диск, 'pull' — загрузить с Диска
async function driveSync(mode){
  const loc = await driveLocate();
  if (mode === 'push'){ await drivePush(loc); return 'pushed'; }
  if (mode === 'pull'){ if (!loc.file) throw Object.assign(new Error('http404'), { status:404 }); await drivePull(loc); return 'pulled'; }
  const d = driveCfg();
  if (!loc.file){ await drivePush(loc); return 'pushed'; }
  if (!d.lastRemote){ d.conflict = true; return 'conflict'; }                // первая привязка, а на Диске уже есть данные
  if (loc.file.modifiedTime === d.lastRemote){ if (d.dirty){ await drivePush(loc); return 'pushed'; } return 'same'; }
  if (!d.dirty){ await drivePull(loc); return 'pulled'; }                    // на Диске новее, здесь ничего не менялось
  d.conflict = true; return 'conflict';                                      // менялось и там, и тут
}
async function driveQuota(){
  try { driveUi.quota = (await (await driveFetch(GAPI + '/about?fields=storageQuota')).json()).storageQuota || null; renderSettings(); } catch(e) {}
}
async function driveRun(mode, quiet){
  if (!driveCfg().connected || driveUi.busy) return;
  driveUi.busy = true; driveLast = Date.now(); clearTimeout(driveTimer);
  if (!quiet) driveSay('Синхронизирую…'); renderSettings();
  try {
    const res = await driveSync(mode);
    if (res === 'conflict'){
      driveSay('На Диске другая версия, и здесь тоже есть изменения. Выбери, какую оставить: «Отправить на Диск» или «Загрузить с Диска».', 'err');
      toast('Google Диск: версии разошлись, открой «Ещё»');
    } else if (res === 'pulled'){
      driveSay('Данные загружены с Диска.', 'ok'); if (quiet) toast('Данные обновлены с Google Диска');
    } else if (res === 'pushed'){ driveSay('Сохранено на Диск.', 'ok'); }
    else if (!quiet){ driveSay('Всё актуально.', 'ok'); }
    driveQuota();
  } catch(e){
    driveSay(driveExplain(e), 'err');
    if (/^(auth|popup|interaction|login_required|consent|immediate)/i.test(String(e && e.message))) driveNeedAuth = true;
    if (quiet && !driveUi.warned){ driveUi.warned = true; toast('Google Диск: ' + driveExplain(e)); }
  } finally { driveUi.busy = false; saveQuiet(); renderSettings(); }
}

async function driveConnect(){
  const d = driveCfg(), mail = (driveUi.email || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return driveSay('Введи адрес своей почты Google, например name@gmail.com.', 'err'), renderSettings();
  if (!driveClientId()) return driveSay('Вход через Google сейчас недоступен.', 'err'), renderSettings();
  if (location.protocol === 'file:') return driveSay('Google не пускает вход со страницы, открытой как файл. Открой приложение по ссылке https://… или через http://localhost.', 'err'), renderSettings();
  driveUi.busy = true; driveSay('Открываю вход Google…'); renderSettings();
  try {
    await requestToken('', mail, true);
    const info = await (await driveFetch('https://www.googleapis.com/oauth2/v3/userinfo')).json();
    if ((info.email || '').toLowerCase() !== mail.toLowerCase()){
      try { if (nativeAuth()) nativeAuth().logout(); else google.accounts.oauth2.revoke(driveToken, () => {}); } catch(_) {}
      driveToken = null; driveTokenExp = 0; rememberToken();
      throw new Error('mismatch:' + (info.email || ''));
    }
    Object.assign(d, { connected:true, email:info.email || mail, name:info.name || '', lastRemote:'', dirty:false, conflict:false });
    saveQuiet(); driveUi.busy = false; driveUi.warned = false;
    await driveRun('auto', false);
  } catch(e){
    const m = String(e.message);
    driveSay(m.startsWith('mismatch:') ? 'В окне Google выбрана другая почта (' + m.slice(9) + '). Войди с адресом ' + mail + '.'
      : m === 'config' ? 'В этой версии приложения вход через Google ещё не настроен.'
      : /popup|access_denied/i.test(m) ? 'Вход отменён: окно Google закрыто или доступ не выдан. Попробуй ещё раз.' : driveExplain(e), 'err');
  }
  finally { driveUi.busy = false; saveQuiet(); renderSettings(); }
}
async function driveReauth(){
  if (driveUi.busy) return;
  driveUi.busy = true; driveSay('Открываю вход Google…'); renderSettings();
  try { await requestToken(''); driveUi.busy = false; driveUi.warned = false; await driveRun('auto', false); }
  catch(e){ driveSay(driveExplain(e), 'err'); }
  finally { driveUi.busy = false; renderSettings(); }
}
function driveDisconnect(){
  if (!confirm('Отвязать аккаунт Google? Файл с данными на Диске останется на месте.')) return;
  try { if (nativeAuth()) nativeAuth().logout(); else if (driveToken && typeof google !== 'undefined') google.accounts.oauth2.revoke(driveToken, () => {}); } catch(e) {}
  driveToken = null; driveTokenExp = 0; rememberToken(); clearTimeout(driveTimer);
  Object.assign(driveCfg(), { connected:false, email:'', name:'', lastSync:'', lastRemote:'', dirty:false, conflict:false });
  driveUi.msg = ''; driveUi.quota = null; saveQuiet(); renderSettings();
  toast('Аккаунт отвязан. Файл на Диске остался на месте.');
}

// Блок настроек «Google Диск»
function driveBlock(){
  const d = driveCfg(), ui = driveUi, isFile = location.protocol === 'file:';
  const dis = ui.busy ? 'disabled' : '';
  const msg = ui.msg ? `<p class="status ${ui.kind}">${esc(ui.msg)}</p>` : '';

  let body;
  if (!d.connected){
    body = `<p class="status" style="margin-top:0">Войди через свою почту Google, и данные приложения будут сохраняться в папке «${DRIVE_FOLDER}» на твоём Диске и подтягиваться на другом устройстве. Приложение видит только файлы, которые создало само.</p>
      ${isFile ? '<div class="note"><span>Сейчас приложение открыто как файл. Google пускает вход только со страницы по адресу https:// или http://localhost, поэтому вход заработает после выкладки.</span></div>' : ''}
      <div class="optlabel">Адрес почты Google</div>
      <input type="email" id="driveEmail" placeholder="name@gmail.com" value="${esc(ui.email)}" autocomplete="email" autocapitalize="off" spellcheck="false">
      ${msg}
      <button class="btn" data-act="driveconnect" ${dis}>Войти через Google</button>`;
  } else {
    const q = ui.quota ? `Занято на Диске: ${fmtBytes(ui.quota.usage)} из ${ui.quota.limit ? fmtBytes(ui.quota.limit) : 'без ограничений'}` : '';
    const last = d.lastSync ? 'Последняя синхронизация: ' + new Date(d.lastSync).toLocaleString('ru-RU', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }) : 'Ещё не синхронизировалось';
    body = `<div class="acct"><i class="ini">${esc((d.name || d.email || 'G').charAt(0).toUpperCase())}</i>
        <div class="stext"><b>${esc(d.name || 'Аккаунт Google')}<span class="chipok">привязан</span></b><small>${esc(d.email)}</small></div></div>
      <p class="status">${esc(last)}${d.dirty ? ' · есть изменения, ещё не отправленные на Диск' : ''}${q ? '<br>' + esc(q) : ''}<br>Папка на Диске: «${DRIVE_FOLDER}»</p>
      ${msg}
      ${d.conflict ? '<p class="status err">Версии разошлись. Выбери, какую оставить, кнопками ниже.</p>' : ''}
      ${tokenValid() ? '' : `<button class="btn" data-act="drivereauth" ${dis}>Войти снова</button>`}
      <div class="seg">
        <button data-act="drivesync" ${dis}>Синхронизировать сейчас</button>
        <button data-act="drivepush" ${dis}>Отправить на Диск</button>
        <button data-act="drivepull" ${dis}>Загрузить с Диска</button>
      </div>
      <div class="setrow" style="margin-top:14px">
        <div><b>Сохранять автоматически</b><small>Через несколько секунд после изменений, пока приложение открыто</small></div>
        <button class="sw ${d.auto ? 'on' : ''}" role="switch" aria-checked="${d.auto}" aria-label="Сохранять автоматически" data-act="driveauto"><i></i></button>
      </div>
      <div class="seg"><button data-act="drivedisconnect" ${dis}>Отвязать аккаунт</button></div>`;
  }
  return `<h3>Google Диск</h3><div class="panel">${body}</div>`;
}

/* ---------- Оценки ---------- */
const GRADE_KINDS = ['Контрольная', 'Лабораторная', 'Семинар', 'Практика', 'Тест', 'Реферат или эссе', 'Зачёт', 'Экзамен', 'Другое'];
const fmtNum = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const avgOf = list => list.length ? list.reduce((a, g) => a + g.value, 0) / list.length : null;
const gradeClass = v => v >= 8 ? 'hi' : v < 4 ? 'bad' : '';

function gradesHTML(s){
  const list = s.grades.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return (list.length ? list.map(g => `<div class="item grade" data-act="editgrade" data-id="${esc(s.id)}" data-gid="${esc(g.id)}">
      <span class="gv ${gradeClass(g.value)}">${fmtNum(g.value)}</span>
      <div class="body"><b>${esc(g.kind)}</b><span>${g.date ? shortDate(g.date) : 'без даты'}${g.note ? ' · ' + esc(g.note) : ''}</span></div></div>`).join('')
    : `<p class="empty">Оценок пока нет.</p>`) +
    `<div class="seg"><button data-act="addgrade" data-id="${esc(s.id)}">+ Оценка</button></div>`;
}
function gradesOverview(){
  if (!state.subjects.length) return `<p class="empty">Сначала добавь предмет.</p>`;
  const all = state.subjects.flatMap(s => s.grades), av = avgOf(all);
  const withG = state.subjects.filter(s => s.grades.length).length;
  const head = `<div class="period"><b>${av === null ? 'Оценок пока нет' : 'Средний балл: ' + fmtNum(av)}</b>
    <span>оценок: ${all.length} · предметов с оценками: ${withG} из ${state.subjects.length}</span>
    ${av === null ? '' : `<div class="pbar"><i style="width:${Math.round(av * 10)}%"></i></div>`}</div>
    <div class="seg"><button data-act="addgrade" data-id="">+ Оценка</button></div>`;
  return head + state.subjects.slice().sort((a, b) => a.name.localeCompare(b.name)).map(s => {
    const a = avgOf(s.grades);
    return `<div class="item grade" data-act="opensubj" data-id="${esc(s.id)}">
      <span class="gv ${a === null ? 'none' : gradeClass(a)}">${a === null ? '—' : fmtNum(a)}</span>
      <div class="body"><b>${esc(s.name)}</b><span><span class="chip" style="border-left:4px solid ${esc(s.color)}">${s.grades.length ? 'оценок: ' + s.grades.length : 'нет оценок'}</span></span></div></div>`;
  }).join('');
}
function gradeForm(sid, g, pre){
  if (!state.subjects.length){ alert('Сначала добавь предмет во вкладке «Предметы».'); return; }
  const isNew = !g, base = pre || g || { value:'', kind:'Контрольная', date:iso(new Date()), note:'' };
  openForm({
    title: isNew ? 'Новая оценка' : 'Оценка',
    fields: [
      { name:'subjectId', label:'Предмет', type:'select', value:sid || state.subjects[0].id, options: state.subjects.map(x => [x.id, x.name]) },
      { name:'value', label:'Оценка (от 0 до 10, можно 7,5)', value:String(base.value).replace('.', ','), required:true },
      { name:'kind', label:'За что', type:'select', value:base.kind, options: GRADE_KINDS.map(k => [k, k]) },
      { name:'date', label:'Дата', type:'date', value:base.date },
      { name:'note', label:'Комментарий', value:base.note || '' }
    ],
    onSave: d => {
      const v = parseFloat(String(d.value).replace(',', '.'));
      if (!(v >= 0 && v <= 10)){
        alert('Оценка должна быть числом от 0 до 10.');
        gradeForm(d.subjectId, g, { value:d.value, kind:d.kind, date:d.date, note:d.note }); return;
      }
      const data = { value:Math.round(v * 10) / 10, kind:d.kind, date:d.date, note:d.note.trim() };
      const target = state.subjects.find(x => x.id === d.subjectId);
      if (isNew) target.grades.push({ id:uid(), ...data });
      else {
        const old = state.subjects.find(x => x.grades.includes(g));
        if (old !== target){ old.grades = old.grades.filter(x => x !== g); target.grades.push(g); }
        Object.assign(g, data);
      }
      commit();
    },
    onDelete: isNew ? null : () => { const old = state.subjects.find(x => x.grades.includes(g)); old.grades = old.grades.filter(x => x !== g); commit(); }
  });
}

const examItem = e => ({ id:'ex:' + e.id, eid:e.id, _exam:true, title:EXAM_KIND[e.kind] + ': ' + e.title,
  subjectId:e.subjectId, due:e.date, type:'deadline', done:!!e.passed });

  if (String(id).startsWith('ex:')){ const e = state.exams.find(x => x.id === String(id).slice(3)); return e && examItem(e); }
  return state.tasks.find(x => x.id === id);
};
const shortDate = d => new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
const examSort = (a, b) => (a.passed - b.passed) || (a.date || '9999').localeCompare(b.date || '9999') || a.title.localeCompare(b.title);

// Где мы сейчас в учебном году и когда ближайшая сессия
function periodCard(){
  const t = iso(new Date());
  const cur = PERIODS.find(p => t >= p.from && t <= p.to);
  const sess = PERIODS.find(p => (p.k === 'win' || p.k === 'sum') && p.to >= t);
  let html = '';
  if (cur){
    const total = daysUntil(cur.to) - daysUntil(cur.from) + 1, left = daysUntil(cur.to);
    const pct = Math.max(0, Math.min(100, Math.round((total - left) / total * 100)));
    html += `<b>${esc(cur.name)}</b><span>до ${shortDate(cur.to)} · осталось ${left} ${plural(left, ['день', 'дня', 'дней'])}</span>
      <div class="pbar"><i style="width:${pct}%"></i></div>`;
  }
  if (sess && sess !== cur){
    const d = daysUntil(sess.from);
    html += `<span>${esc(sess.name)}: ${shortDate(sess.from)} — ${shortDate(sess.to)} · через ${d} ${plural(d, ['день', 'дня', 'дней'])}</span>`;
  }
  return html ? `<div class="period">${html}</div>` : '';
}

/* ---------- Файлы предметов на Google Диске ---------- */
// Файл загружается прямо из приложения в папку «Мой универ / Файлы» на Диске. В приложении хранится только запись о нём.
const FILE_MAX = 50 * 1024 * 1024;
const fileUi = { busy:{} };      // id предмета -> идёт загрузка
function filesHTML(s){
  const d = driveCfg(), list = s.files || [], busy = fileUi.busy[s.id];
  const items = list.map(f => `<div class="item file"><div class="body"><b>${esc(f.name)}</b><small>${esc(fmtBytes(f.size))}</small></div>
      <button class="mini" data-act="openfile" data-id="${esc(s.id)}" data-fid="${esc(f.id)}">Открыть</button>
      <button class="mini" data-act="delfile" data-id="${esc(s.id)}" data-fid="${esc(f.id)}" aria-label="Удалить файл">×</button></div>`).join('');
  if (!d.connected)
    return items + `<p class="empty">Чтобы прикреплять файлы, привяжи Google Диск. <button class="mini" data-act="tab" data-id="settings">Открыть «Ещё»</button></p>`;
  return (items || '<p class="empty">Файлов пока нет.</p>') +
    `<label class="btn attach ${busy ? 'dis' : ''}">${busy ? 'Загружаю…' : '+ Прикрепить файл'}<input type="file" id="fileInput" data-subj="${esc(s.id)}" multiple hidden ${busy ? 'disabled' : ''}></label>
     <p class="attach-note">Файлы хранятся в твоём Google Диске (папка «${DRIVE_FOLDER} / Файлы») и открываются прямо здесь. До ${FILE_MAX / 1048576} МБ каждый.</p>`;
}
async function driveFilesFolder(){
  if (driveUi.filesFolder) return driveUi.filesFolder;
  const j = async r => (await r).json();
  const root = (await driveLocate()).folderId;
  const q = "mimeType='application/vnd.google-apps.folder' and name='Файлы' and '" + root + "' in parents and trashed=false";
  const f = await j(driveFetch(GAPI + '/files?fields=files(id)&q=' + encodeURIComponent(q)));
  let id = f.files && f.files[0] && f.files[0].id;
  if (!id) id = (await j(driveFetch(GAPI + '/files?fields=id', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ name:'Файлы', mimeType:'application/vnd.google-apps.folder', parents:[root] }) }))).id;
  return driveUi.filesFolder = id;
}
async function driveUploadOne(file, retried){
  const folder = await driveFilesFolder();
  const b = 'muni' + uid(), meta = JSON.stringify({ name:file.name, parents:[folder] });
  const body = new Blob(['--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + b +
    '\r\nContent-Type: ' + (file.type || 'application/octet-stream') + '\r\n\r\n', file, '\r\n--' + b + '--']);
  try {
    return await (await driveFetch(GUP + '/files?uploadType=multipart&fields=id,name', { method:'POST',
      headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body })).json();
  } catch(e){
    if (e.status === 404 && !retried){ driveUi.filesFolder = null; return driveUploadOne(file, true); }   // папку могли удалить
    throw e;
  }
}
async function uploadFiles(subjId, list){
  const s = state.subjects.find(x => x.id === subjId);
  if (!s || !list.length || fileUi.busy[subjId]) return;
  if (!driveCfg().connected) return toast('Сначала привяжи Google Диск в «Ещё»');
  fileUi.busy[subjId] = true; renderAll();
  let ok = 0; const bad = [];
  for (const f of list){
    if (f.size > FILE_MAX){ bad.push(f.name + ': больше ' + FILE_MAX / 1048576 + ' МБ'); continue; }
    try {
      const m = await driveUploadOne(f);
      (s.files = s.files || []).push({ id:uid(), name:f.name, size:f.size, type:f.type || '', driveId:m.id, added:new Date().toISOString() }); ok++;
    } catch(e){ bad.push(f.name + ': ' + driveExplain(e)); }
  }
  delete fileUi.busy[subjId]; commit();
  toast((ok ? 'Прикреплено файлов: ' + ok + '. ' : '') + (bad.length ? 'Не получилось: ' + bad.join('; ') : ''));
}
async function openDriveFile(subjId, fid){
  const f = (state.subjects.find(x => x.id === subjId) || { files:[] }).files.find(x => x.id === fid);
  if (!f) return;
  const preview = /^(image\/|application\/pdf|text\/plain)/.test(f.type);
  const w = preview ? window.open('', '_blank') : null;       // вкладку открываем сразу, иначе браузер её заблокирует
  try {
    let blob = await (await driveFetch(GAPI + '/files/' + f.driveId + '?alt=media')).blob();
    if (/^text\//.test(blob.type) && !/charset/i.test(blob.type)) blob = new Blob([blob], { type:blob.type + ';charset=utf-8' });   // чтобы кириллица не ломалась
    const url = URL.createObjectURL(blob);
    if (w) w.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 300000);
  } catch(e){
    if (w) w.close();
    toast(e.status === 404 ? 'Файла уже нет на Диске. Убери его из списка кнопкой ×.' : driveExplain(e));
  }
}
async function delDriveFile(subjId, fid){
  const s = state.subjects.find(x => x.id === subjId), f = s && s.files.find(x => x.id === fid);
  if (!f) return;
  const link = driveCfg().connected;
  if (!confirm(link ? 'Удалить «' + f.name + '» и из приложения, и с Google Диска?' : 'Убрать «' + f.name + '» из списка? Сам файл на Диске останется.')) return;
  if (link){
    try { await driveFetch(GAPI + '/files/' + f.driveId, { method:'DELETE' }); }
    catch(e){ if (e.status !== 404){ toast(driveExplain(e)); return; } }
  }
  s.files = s.files.filter(x => x.id !== fid); commit();
}
