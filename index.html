/* ---------- Напоминания о дедлайнах ---------- */
const REMIND_DAYS = [[0,'В день срока'],[1,'За 1 день'],[2,'За 2 дня'],[3,'За 3 дня'],[7,'За неделю']];
const hasNotif = () => typeof Notification !== 'undefined';
const whenText = d => d === 0 ? 'срок сегодня' : d === 1 ? 'срок завтра' : 'срок через ' + d + ' ' + plural(d, ['день', 'дня', 'дней']);

// Уведомление браузера. Вернёт true, если получилось показать.
function browserNotify(title, body){
  if (!hasNotif() || Notification.permission !== 'granted') return false;
  try { new Notification(title, { body, tag:'moy-univer' }); return true; } catch(e) { return false; }
}
// Спросить у браузера разрешение (работает только по нажатию кнопки)
function askPermission(){
  try {
    if (hasNotif() && Notification.permission === 'default'){
      const r = Notification.requestPermission();
      if (r && r.then) r.then(() => renderAll());
    }
  } catch(e) {}
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 3500);
}

// Проверка: пора ли о чём-то напомнить? Запускается при открытии и каждую минуту.
function checkReminders(){
  const n = state.settings.notify;
  if (!n.on || !n.days.length) return;
  const now = new Date(), todayISO = iso(now);
  const [h, m] = (n.time || '09:00').split(':').map(Number);
  if (now.getHours() * 60 + now.getMinutes() < h * 60 + m) return;      // ещё рано

  // стираем старые отметки (старше 45 дней)
  const limit = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 45));
  Object.keys(state.reminded).forEach(k => { if (k.split('|')[2] < limit) delete state.reminded[k]; });

  const fresh = [];
  [...state.tasks, ...examItems()].forEach(t => {
    if (t.done || !t.due) return;
    if (n.scope === 'deadline' && t.type !== 'deadline') return;
    const d = daysUntil(t.due);
    if (!n.days.includes(d)) return;
    const key = t.id + '|' + d + '|' + todayISO;
    if (state.reminded[key]) return;                                    // сегодня уже напоминали
    state.reminded[key] = true;
    state.alerts.push({ key, taskId:t.id });
    fresh.push(t);
  });
  if (!fresh.length) return;
  saveQuiet(); renderAlerts();

  const line = t => t.title + ' · ' + subj(t.subjectId).name + ' · ' + whenText(daysUntil(t.due));
  if (fresh.length === 1) browserNotify('Дедлайн: ' + fresh[0].title, line(fresh[0]));
  else browserNotify('Дедлайны: ' + fresh.length, fresh.map(line).join('\n'));
}

// Плашки с напоминаниями вверху страницы
function renderAlerts(){
  const seen = new Set();
  const list = state.alerts.filter(a => {
    const t = findDeadline(a.taskId);
    if (!t || t.done || seen.has(a.taskId)) return false;
    seen.add(a.taskId); return true;
  });
  const bell = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
  $('#alerts').innerHTML = list.map(a => {
    const t = findDeadline(a.taskId);
    return `<div class="alert" data-act="${t._exam ? 'openexam' : 'edittask'}" data-id="${esc(t._exam ? t.eid : t.id)}">${bell}
      <div class="body"><b>${esc(t.title)}</b><span>${esc(subj(t.subjectId).name)} · ${whenText(daysUntil(t.due))}</span></div>
      <button class="mini" data-act="alertdel" data-id="${esc(a.key)}" aria-label="Скрыть">✕</button></div>`;
  }).join('');
}

/* =========================================================
   4. ОКНО РЕДАКТИРОВАНИЯ
   openForm строит форму по списку полей и вызывает onSave / onDelete
   ========================================================= */
function openForm({ title, fields, onSave, onDelete }){
  const dlg = $('#dlg'), form = $('#dlgForm');
  form.innerHTML = `<h3>${esc(title)}</h3>` + fields.map(f => {
    let input;
    if (f.type === 'select'){
      input = `<select name="${f.name}">` + f.options.map(o =>
        `<option value="${esc(o[0])}" ${o[0] === f.value ? 'selected' : ''}>${esc(o[1])}</option>`).join('') + `</select>`;
    } else if (f.type === 'textarea'){
      input = `<textarea name="${f.name}" rows="4">${esc(f.value)}</textarea>`;
    } else {
      input = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value)}" ${f.required ? 'required' : ''}>`;
    }
    return `<label>${esc(f.label)}${input}</label>`;
  }).join('') +
  `<div class="row">
     <button type="button" class="btn ghost" id="dlgCancel">Отмена</button>
     ${onDelete ? '<button type="button" class="btn danger" id="dlgDel">Удалить</button>' : ''}
     <button type="submit" class="btn">Сохранить</button>
   </div>`;

  form.onsubmit = e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    dlg.close(); onSave(data);
  };
  $('#dlgCancel').onclick = () => dlg.close();
  if (onDelete) $('#dlgDel').onclick = () => { dlg.close(); onDelete(); };
  dlg.showModal();
}

/* ---------- Формы: пара, задание, предмет, ссылка ---------- */
// '2026-11-02' → '02.11'  и обратно
const datesToText = l => (l.dates || []).map(s => s.slice(8, 10) + '.' + s.slice(5, 7)).join(', ');
function parseDates(text){
  const y = new Date().getFullYear();
  return (text || '').split(/[,;\s]+/).filter(Boolean).map(p => {
    const m = p.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?$/);
    return m ? (m[3] || y) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : null;
  }).filter(Boolean);
}

function lessonForm(l, dayISO){
  if (!state.subjects.length){ alert('Сначала добавь предмет во вкладке «Предметы».'); return; }
  const isNew = !l;
  l = l || {
    day: dayISO ? (new Date(dayISO + 'T00:00:00').getDay() + 6) % 7 : todayIdx(),
    start:'09:00', end:'10:30', subjectId: state.subjects[0].id,
    room:'', week:'all', kind:'', teacher:'', groups:[], dates:[]
  };
  openForm({
    title: isNew ? 'Новая пара' : 'Пара',
    fields: [
      { name:'day', label:'День недели', type:'select', value:String(l.day), options: DAYS.map((d, i) => [String(i), d]) },
      { name:'start', label:'Начало', type:'time', value:l.start, required:true },
      { name:'end',   label:'Конец',  type:'time', value:l.end,   required:true },
      { name:'subjectId', label:'Предмет', type:'select', value:l.subjectId, options: state.subjects.map(s => [s.id, s.name]) },
      { name:'kind', label:'Тип (ЛК, СЕМ, ПЗ, ЛЗ...)', value:l.kind || '' },
      { name:'room', label:'Аудитория', value:l.room },
      { name:'teacher', label:'Преподаватель', value:l.teacher || '' },
      { name:'dates', label:'Даты (пусто = каждую неделю), например 02.11, 16.11', value:datesToText(l) }
    ],
    onSave: d => {
      const data = {
        day:+d.day, start:d.start, end:d.end, subjectId:d.subjectId,
        kind:d.kind.trim(), room:d.room, teacher:d.teacher,
        dates: parseDates(d.dates)      // группа и чётность недели у существующих пар остаются как были
      };
      if (isNew) state.lessons.push({ id:uid(), groups:[], week:'all', ...data });
      else Object.assign(l, data);
      commit();
    },
    onDelete: isNew ? null : () => { state.lessons = state.lessons.filter(x => x !== l); commit(); }
  });
}

/* =========================================================
   5. КЛИКИ
   Один обработчик на всю страницу: смотрим на data-act у кнопки,
   по которой нажали, и решаем, что делать.
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if (act === 'tab')       { currentTab = id; if (id !== 'subjects') openSubject = null; renderAll(); }
  else if (act === 'week') { state.settings.week = id; commit(); }
  else if (act === 'subjview'){ subjView = id; renderAll(); }
  else if (act === 'addgrade'){ gradeForm(id); }
  else if (act === 'editgrade'){ const sj = state.subjects.find(x => x.id === id); if (sj) gradeForm(id, sj.grades.find(x => x.id === el.dataset.gid)); }
  else if (act === 'taskview'){ taskView = id; openExam = null; renderAll(); }
  else if (act === 'sessem'){ sessSem = +id; renderAll(); }
  else if (act === 'addexam'){ examForm(null); }
  else if (act === 'openexam'){ openExam = id; taskView = 'session'; currentTab = 'tasks'; renderAll(); window.scrollTo(0, 0); }
  else if (act === 'examback'){ openExam = null; renderAll(); }
  else if (act === 'editexam'){ examForm(state.exams.find(x => x.id === id)); }
  else if (act === 'examtoggle'){ const x = state.exams.find(e => e.id === id); if (x){ x.passed = !x.passed; commit(); } }
  else if (act === 'addtopic'){ addTopic(id); }
  else if (act === 'bulktopics'){ bulkTopics(id); }
  else if (act === 'topictoggle'){
    const t = (state.exams.find(e => e.id === id) || { topics:[] }).topics.find(x => x.id === el.dataset.tid); if (t){ t.done = !t.done; commit(); }
  }
  else if (act === 'topicdel'){
    const x = state.exams.find(e => e.id === id); if (x){ x.topics = x.topics.filter(t => t.id !== el.dataset.tid); commit(); }
  }
  else if (act === 'showdone') { state.settings.showDone = (id === '1'); commit(); }
  else if (act === 'theme')    { state.settings.theme = id; commit(); }
  else if (act === 'addlesson'){ lessonForm(null, id); }
  else if (act === 'group'){ state.settings.group = id; commit(); }
  else if (act === 'opensearch'){ openSearch(); }
  else if (act === 'searchclose'){ $('#searchDlg').close(); }
  else if (act === 'searchclear'){ const i = $('#searchInput'); i.value = ''; renderSearch(); i.focus(); }
  else if (act === 'searchmore'){ searchMore[id] = true; renderSearch(); }
  else if (act === 'sr'){                          // нажали на результат поиска
    const kind = el.dataset.kind;
    $('#searchDlg').close();
    if (kind === 'task'){ taskForm(state.tasks.find(t => t.id === id)); }
    else if (kind === 'subj' || kind === 'note'){
      currentTab = 'subjects'; openSubject = id; renderAll(); window.scrollTo({ top:0 });
      if (kind === 'note') focusNote(+el.dataset.pos, +el.dataset.len);
    }
    else if (kind === 'teacher'){                  // показываем неделю с его ближайшей парой
      currentTab = 'week'; openSubject = null;
      weekStart = el.dataset.date ? mondayOf(new Date(el.dataset.date + 'T00:00:00')) : initialWeekStart();
      renderAll(); window.scrollTo({ top:0 });
    }
  }
  else if (act === 'installapp'){
    if (installEvt){ const ev = installEvt; installEvt = null; ev.prompt(); ev.userChoice.finally(renderSettings); renderSettings(); }
  }
  else if (act === 'driveconnect'){ driveConnect(); }
  else if (act === 'drivereauth'){ driveReauth(); }
  else if (act === 'drivesync'){ driveRun('auto', false); }
  else if (act === 'drivepush'){ if (confirm('Перезаписать данные на Google Диске версией с этого устройства?')) driveRun('push', false); }
  else if (act === 'drivepull'){ if (confirm('Заменить данные на этом устройстве версией с Google Диска?')) driveRun('pull', false); }
  else if (act === 'driveauto'){
    const d = driveCfg(); d.auto = !d.auto; saveQuiet(); renderSettings();
    if (d.auto && d.dirty) driveRun('auto', true);
  }
  else if (act === 'drivedisconnect'){ driveDisconnect(); }
  else if (act === 'notifytoggle'){
    const n = state.settings.notify; n.on = !n.on;
    if (n.on) askPermission();                    // спрашиваем разрешение у браузера
    else state.alerts = [];                       // выключили — убираем плашки
    commit(); checkReminders();
  }
  else if (act === 'ndays'){
    const n = state.settings.notify, d = +id;
    n.days = n.days.includes(d) ? n.days.filter(x => x !== d) : [...n.days, d].sort((a, b) => a - b);
    commit(); checkReminders();
  }
  else if (act === 'nscope'){ state.settings.notify.scope = id; commit(); checkReminders(); }
  else if (act === 'notifyperm'){ askPermission(); }
  else if (act === 'notifytest'){
    const ok = browserNotify('Мой универ', 'Так будут выглядеть напоминания о дедлайнах');
    toast(ok ? 'Тестовое уведомление отправлено' : 'Браузер не показывает уведомления, напоминания будут внутри приложения');
  }
  else if (act === 'alertdel'){
    const a = state.alerts.find(x => x.key === id);
    state.alerts = state.alerts.filter(x => !a || x.taskId !== a.taskId); saveQuiet(); renderAlerts();
  }
  else if (act === 'calprev'){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderAll(); }
  else if (act === 'calnext'){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderAll(); }
  else if (act === 'caltoday'){ calMonth = monthStart(new Date()); calSel = iso(new Date()); renderAll(); }
  else if (act === 'calday'){
    calSel = id;
    const d = new Date(id + 'T00:00:00');
    if (d.getMonth() !== calMonth.getMonth()) calMonth = monthStart(d);   // нажала на серый день соседнего месяца
    renderAll();
  }
  else if (act === 'caladd'){ taskForm(null, null, calSel); }
  else if (act === 'wkprev'){ weekStart.setDate(weekStart.getDate() - 7); renderAll(); }
  else if (act === 'wknext'){ weekStart.setDate(weekStart.getDate() + 7); renderAll(); }
  else if (act === 'wktoday'){ weekStart = initialWeekStart(); renderAll(); }
  else if (act === 'editlesson'){ lessonForm(state.lessons.find(l => l.id === id)); }
  else if (act === 'toggle'){
    const t = state.tasks.find(t => t.id === id); t.done = !t.done; commit();
  }
  else if (act === 'edittask'){ taskForm(state.tasks.find(t => t.id === id)); }
  else if (act === 'opensubj'){ openSubject = id; renderAll(); }
  else if (act === 'back')    { openSubject = null; renderAll(); }
  else if (act === 'editsubj'){ subjectForm(state.subjects.find(s => s.id === id)); }
  else if (act === 'openfile'){ openDriveFile(id, el.dataset.fid); }
  else if (act === 'delfile'){ delDriveFile(id, el.dataset.fid); }
  else if (act === 'dellink'){
    state.subjects.find(s => s.id === id).links.splice(+el.dataset.i, 1); commit();
  }
  else if (act === 'fab'){
    if (currentTab === 'week')  lessonForm(null);
    if (currentTab === 'tasks') taskView === 'session' ? examForm(null) : taskForm(null);
    if (currentTab === 'calendar') taskForm(null, null, calSel);
    if (currentTab === 'subjects'){
      const s = state.subjects.find(x => x.id === openSubject);
      s ? linkForm(s) : subjView === 'grades' ? gradeForm('') : subjectForm(null);
    }
  }
  else if (act === 'reset'){
    if (!confirm('Стереть ВСЁ без возможности вернуть? Лучше сначала скачай копию.')) return;
    state = normalize({}); openSubject = null; commit();
  }
  else if (act === 'export'){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'moy-universitet-' + iso(new Date()) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  }
  else if (act === 'import'){ $('#importFile').click(); }
});

// Загрузка резервной копии
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!Array.isArray(obj.subjects) || !Array.isArray(obj.lessons) || !Array.isArray(obj.tasks)) throw new Error();
      if (!confirm('Заменить текущие данные данными из копии?')) return;
      state = normalize(obj); openSubject = null; commit();
    } catch(err) { alert('Не получилось прочитать файл. Это точно копия из этого приложения?'); }
  };
  reader.readAsText(e.target.files[0]);
});

  const dlg = $('#searchDlg');
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK'){ e.preventDefault(); openSearch(); return; }     // Ctrl+K
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === '/' && !dlg.open && !document.querySelector('dialog[open]') && !['input', 'textarea', 'select'].includes(tag)){
    e.preventDefault(); openSearch(); return;                                                           // «/»
  }
  if (!dlg.open) return;
  const items = [...dlg.querySelectorAll('.sitem')];
  if (e.target.id === 'searchInput' && e.key === 'Enter' && items[0]){ e.preventDefault(); items[0].click(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    const next = items.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : -1);
    if (next < 0) $('#searchInput').focus(); else if (items[next]) items[next].focus();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'driveEmail'){ driveUi.email = e.target.value.trim(); }
  if (e.target.id === 'fileInput'){ const fl = [...e.target.files]; uploadFiles(e.target.dataset.subj, fl); e.target.value = ''; }
});
// Если тихое продление входа не удалось, подтверждаем вход одним касанием (браузер разрешает окно только после нажатия)
document.addEventListener('pointerup', () => {
  if (!driveNeedAuth || driveUi.busy || !driveCfg().connected) return;
  driveNeedAuth = false; driveReauth();
}, { passive:true });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && driveCfg().connected && Date.now() - driveLast > 60000) driveRun('auto', true);
});

// Время напоминания
document.addEventListener('change', e => {
  if (e.target.id !== 'notifyTime') return;
  state.settings.notify.time = e.target.value || '09:00';
  commit(); checkReminders();
});

renderAll();
checkReminders();
if (driveCfg().connected) driveRun('auto', true);       // при открытии сверяемся с Диском
setInterval(checkReminders, 60000);                                   // проверяем каждую минуту
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });
</script>
</body>
</html>
