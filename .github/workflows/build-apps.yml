name: Собрать приложения (Windows и Android)

# Запускается вручную: вкладка Actions → «Собрать приложения» → Run workflow.
# Готовые файлы появятся внизу страницы запуска (Artifacts) и в разделе Releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - name: Подготовить сайт и значок
        shell: bash
        run: |
          mkdir -p native/desktop/www native/desktop/build
          cp index.html manifest.webmanifest native/desktop/www/
          cp -r icons native/desktop/www/icons
          cp icons/icon-512.png native/desktop/build/icon.png
      - name: Вставить ключ Google для компьютера (из секретов репозитория)
        shell: bash
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
        run: |
          if [ -z "$GOOGLE_DESKTOP_SECRET" ]; then echo "::warning::Секрет GOOGLE_DESKTOP_SECRET не задан: вход Google в Windows-версии работать не будет"; fi
          node -e "const fs=require('fs');const f='native/desktop/google-desktop.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.client_secret=process.env.GOOGLE_DESKTOP_SECRET||'';fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Собрать установщик
        working-directory: native/desktop
        shell: bash
        run: |
          npm ci
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows
          path: |
            native/desktop/dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - name: Подготовить сайт
        run: |
          mkdir -p native/mobile/www native/mobile/assets
          cp index.html manifest.webmanifest native/mobile/www/
          cp -r icons native/mobile/www/icons
          pip install pillow
          python3 native/mobile/make_icons.py
      - name: Собрать Android-проект
        working-directory: native/mobile
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate --android || true
          python3 make_manifest.py
          npx cap sync android
      - name: Собрать APK
        working-directory: native/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Подписать APK постоянным ключом
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            ALIAS=moyuniver
          else
            echo "::warning::Секреты ANDROID_KEYSTORE_B64 и ANDROID_KEYSTORE_PASSWORD не заданы: APK подписан временным ключом, обновлять поверх прошлой версии его нельзя, и вход Google на нём не заработает"
            KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" -alias temp -keyalg RSA -keysize 2048 -validity 30 -dname "CN=temp"
            ALIAS=temp
          fi
          export KS_PASS
          cd native/mobile/android/app/build/outputs/apk/release
          "$BT/zipalign" -p -f 4 app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$ALIAS" --ks-pass env:KS_PASS --out "$GITHUB_WORKSPACE/Moy-universitet.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Moy-universitet.apk" | grep -i "SHA-1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android
          path: Moy-universitet.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out }
      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apps-latest
          name: Приложения «Мой универ»
          body: "Windows: установщик (Setup) или портативная версия (без установки). Android: файл .apk."
          files: out/**/*
          make_latest: true
