name: Обновить версии и lock-файлы

# Запускается вручную. Берёт свежие версии Electron и сборщика, фиксирует точные версии
# библиотек в package-lock.json и сохраняет их в репозитории: сборки используют именно их.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - name: Компьютер — свежий Electron и точные версии
        working-directory: native/desktop
        run: npm install --package-lock-only --save-dev electron@latest electron-builder@latest
      - name: Телефон — точные версии
        working-directory: native/mobile
        run: npm install --package-lock-only
      - name: Сохранить в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/desktop/package.json native/desktop/package-lock.json native/mobile/package-lock.json
          git diff --cached --quiet && echo "Изменений нет" || { git commit -m "Зафиксированы версии библиотек (lock-файлы), свежий Electron"; git push; }
